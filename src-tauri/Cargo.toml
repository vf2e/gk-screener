[package]
name = "job-screener"
version = "0.1.0"
description = "岗位筛选器 - 国考/省考职位筛选与冲稳保分档"
authors = ["wangchang"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "job_screener_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.37"
rust_xlsxwriter = "0.100"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
